<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CamWay — Configurar NVR</title>
<style>
  :root{--bg:#0b0d11;--panel:#161b22;--line:#273040;--fg:#e7ecf3;--mut:#8b96a7;--acc:#2ad4e0;--bad:#ef4444;--ok:#22c55e}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px system-ui,Segoe UI,Roboto,sans-serif}
  .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px;width:460px;max-width:100%}
  .logo{font-size:26px;font-weight:800;text-align:center;margin-bottom:4px}
  .logo .w{color:var(--acc)}
  h1{font-size:17px;margin:12px 0 2px}
  p.sub{color:var(--mut);margin:0 0 16px;font-size:13px}
  label{display:block;margin:12px 0 5px;color:var(--mut);font-size:13px}
  input,select{width:100%;background:#0f141b;color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font:inherit}
  .row{display:flex;gap:10px}
  .row>div{flex:1}
  button{width:100%;margin-top:18px;border:0;border-radius:10px;background:var(--acc);color:#04222a;font:inherit;font-weight:700;padding:12px;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  .msg{margin-top:12px;min-height:18px;font-size:13px}
  .msg.err{color:var(--bad)} .msg.ok{color:var(--ok)}
  .foot{margin-top:14px;text-align:center}
  .foot a{color:var(--acc);font-size:13px;text-decoration:none}
  .hint{color:var(--mut);font-size:12px;margin-top:4px}
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <div class="logo">Cam<span class="w">Way</span></div>
  <h1>Agregar NVR</h1>
  <p class="sub">Escribe la dirección del NVR y sus credenciales. Se darán de alta todas sus cámaras (canales).</p>

  <label>Acceso de administrador</label>
  <div class="row">
    <div><input id="adm-user" placeholder="Usuario admin" value="admin" autocomplete="username"></div>
    <div><input id="adm-pass" type="password" placeholder="Clave admin" autocomplete="current-password"></div>
  </div>

  <label>IP del NVR</label>
  <input id="host" placeholder="p. ej. 192.168.1.108" inputmode="decimal">
  <div class="row">
    <div><label>Usuario del NVR</label><input id="cam-user" placeholder="admin"></div>
    <div><label>Clave del NVR</label><input id="cam-pass" type="password"></div>
  </div>
  <div class="row">
    <div><label>N.º de cámaras</label><input id="channels" type="number" min="1" max="64" value="4"></div>
    <div><label>Tipo de NVR</label>
      <select id="proto"><option value="dahua">Dahua / genérico</option><option value="hikvision">Hikvision</option></select></div>
  </div>
  <div class="hint">Puerto RTSP 554. Se usa el flujo ligero (substream) para ver fluido con bajo consumo.</div>

  <button id="go">Agregar cámaras</button>
  <div class="msg" id="msg"></div>
  <div class="foot"><a href="/live">← Volver al video</a></div>
</div></div>
<script src="/static/nvr.js"></script>
</body>
</html>
