<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CamWay — Modo TV</title>
<style>
  :root { --bg:#05070c; --panel:#0f1620; --line:#2a3650; --text:#e5e7eb;
          --muted:#8aa0c0; --accent:#2f6fed; }
  * { box-sizing: border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--bg); color:var(--text); overflow:hidden;
    font:16px/1.4 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  #grid { display:grid; gap:4px; width:100vw; height:100vh; padding:4px; }
  .cell { position:relative; background:#000; border:3px solid transparent;
    border-radius:6px; overflow:hidden; }
  .cell.focus { border-color:var(--accent); }
  .cell video { width:100%; height:100%; object-fit:contain; background:#000; display:block; }
  .cell .lbl { position:absolute; left:0; bottom:0; right:0; padding:4px 10px;
    font-size:min(3.2vw,20px); background:linear-gradient(transparent,rgba(0,0,0,.75));
    color:#fff; text-shadow:0 1px 2px #000; }
  .cell .st { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:min(3.5vw,22px); }
  #grid.maxed .cell { display:none; }
  #grid.maxed .cell.max { display:block; position:fixed; inset:0; border:none; border-radius:0; z-index:10; }
  /* Login */
  #login { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:var(--bg); z-index:50; }
  #login.show { display:flex; }
  #login .box { background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:36px 40px; width:min(92vw,520px); text-align:center; }
  #login h1 { font-size:28px; margin-bottom:6px; }
  #login p { color:var(--muted); margin-bottom:22px; }
  #login input { display:block; width:100%; margin:10px 0; padding:16px 18px; font-size:22px;
    background:#0b1220; border:2px solid var(--line); border-radius:10px; color:var(--text); }
  #login input:focus, #login button:focus { outline:3px solid var(--accent); }
  #login button { width:100%; margin-top:14px; padding:16px; font-size:22px; font-weight:600;
    background:var(--accent); color:#fff; border:none; border-radius:10px; cursor:pointer; }
  #err { color:#ff8a80; min-height:24px; margin-top:10px; }
  #hint { position:fixed; left:0; right:0; bottom:0; text-align:center; color:var(--muted);
    font-size:min(2.6vw,15px); padding:6px; background:rgba(0,0,0,.45); z-index:20;
    opacity:0; transition:opacity .3s; pointer-events:none; }
  #hint.show { opacity:1; }
  #empty { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    color:var(--muted); font-size:22px; text-align:center; padding:30px; }
  #menuBtn { position:fixed; top:10px; right:12px; z-index:30; width:46px; height:46px;
    border-radius:10px; border:1px solid var(--line); background:rgba(11,18,32,.6);
    color:#fff; font-size:22px; cursor:pointer; opacity:.5; transition:opacity .2s; }
  #menuBtn:hover, #menuBtn:focus { opacity:1; outline:none; }
  /* Panel (menú / grabaciones) */
  #panel { position:fixed; inset:0; display:none; z-index:40;
    background:rgba(3,5,10,.82); backdrop-filter:blur(3px); }
  #panel.show { display:flex; align-items:stretch; }
  #panel .pbox { width:min(92vw,560px); height:100%; background:var(--panel);
    border-right:1px solid var(--line); padding:26px 0 0; display:flex; flex-direction:column; }
  #panel h2 { font-size:24px; padding:0 28px 18px; color:#fff; }
  #panel .plist { flex:1; overflow-y:auto; padding:0 14px 20px; }
  #panel .pitem { display:block; width:100%; text-align:left; margin:6px 0; padding:16px 18px;
    font-size:20px; background:#0b1220; border:2px solid transparent; border-radius:10px;
    color:var(--text); cursor:pointer; }
  #panel .pitem.focus, #panel .pitem:focus { border-color:var(--accent); background:#12203a; outline:none; }
  #panel .pmuted { color:var(--muted); padding:14px 18px; font-size:18px; }
  /* Reproductor de grabación */
  #rec { position:fixed; inset:0; display:none; background:#000; z-index:45; }
  #rec.show { display:block; }
  #rec video { width:100%; height:100%; object-fit:contain; background:#000; }
  #rec .rlbl { position:absolute; left:0; top:0; right:0; padding:10px 16px; color:#fff;
    font-size:min(3vw,18px); background:linear-gradient(rgba(0,0,0,.7),transparent); }
</style>
</head>
<body>
  <div id="grid"></div>
  <div id="empty">No hay cámaras disponibles para este usuario.</div>
  <div id="hint"></div>
  <button id="menuBtn" title="Menú">☰</button>
  <div id="panel"></div>
  <div id="rec"><video playsinline controls></video><div class="rlbl"></div></div>

  <div id="login">
    <div class="box">
      <h1>CamWay — TV</h1>
      <p>Inicia sesión para ver el mosaico</p>
      <input id="u" type="text" placeholder="usuario" autocomplete="username">
      <input id="p" type="password" placeholder="contraseña" autocomplete="current-password">
      <button id="go">Entrar</button>
      <div id="err"></div>
    </div>
  </div>

  <script src="/static/vendor/hls.min.js"></script>
  <script src="/static/tv.js?v=3"></script>
</body>
</html>
