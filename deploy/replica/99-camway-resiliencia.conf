# CamWay: el equipo queda sin personal tecnico. Si el kernel se cuelga de
# verdad, que se reinicie solo en ~2 minutos en vez de esperar a que alguien
# vaya a apagar y encender.
#
# Contexto: el 20/11/2026 el servidor del taladro se quedo sin responder y hubo
# que apagarlo a la fuerza (journal corrupto, 9 minutos de log perdidos).

# Volcado/panico del kernel -> reiniciar a los 10 s.
kernel.panic = 10

# Un oops (fallo del kernel, no de un proceso) tambien reinicia.
kernel.panic_on_oops = 1

# Una tarea bloqueada mas de 120 s sin avanzar = cuelgue real -> reiniciar.
# No hay montajes de red (NFS/CIFS) en este equipo, que es el caso que daria
# falsos positivos.
kernel.hung_task_panic = 1
kernel.hung_task_timeout_secs = 120

# Con 60 el sistema empezaba a sacar paginas a swap con RAM libre; eso fue lo
# que dejo el equipo sin respuesta (pswpout 685 KB/s) antes del apagon.
vm.swappiness = 10
