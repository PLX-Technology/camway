# Journal persistente y a disco cada 10 s.
#
# El valor por defecto (5 min) hace que un cuelgue se lleve por delante los
# ultimos minutos de log: el 20/11/2026 se perdieron justo los que explicaban
# el fallo (swap masivo + OOM del mosaico). Con 10 s se pierde como mucho eso.

[Journal]
Storage=persistent
SyncIntervalSec=10s
SystemMaxUse=2G
