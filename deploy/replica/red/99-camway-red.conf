# CamWay: dos tarjetas en la misma LAN
#
# El servidor tiene una tarjeta en la LAN de camaras (192.168.0.0/24) y otra en
# la del router (192.168.88.0/24), pero el equipo de red las mezcla: se veian
# entradas ARP de las camaras por las DOS interfaces (ARP flux).
#
# Sintoma: MediaMTX fallaba cada ~25 s con
#   [RTSP source] dial tcp 192.168.0.32:554: connect: no route to host
# y cada fallo cerraba la grabacion en curso (archivos de segundos en vez de
# los 10 minutos configurados).
#
# arp_ignore=1     -> no contestar ARP por direcciones que no son de esa interfaz
# arp_announce=2   -> anunciar siempre la IP propia de la interfaz de salida
# rp_filter=2      -> filtro de ruta holgado (no rompe rutas asimetricas)
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
net.ipv4.conf.all.rp_filter = 2
